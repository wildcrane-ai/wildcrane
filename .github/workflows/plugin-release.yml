# Builds the plugins' start script (runner/ writes plugins/<host>/server/dist/start.mjs) and attaches the
# Codex marketplace with its plugin as wildcrane-codex.zip (#2160) to the release of the tag
# `plugin-v<version>` (every plugin.json's version). The same Codex marketplace becomes the
# next commit of the `codex-plugin` branch, the Git source Codex installs and upgrades from (#528);
# the zip stays for older plugins whose update steps still name it. The Cursor plugin becomes the next
# commit of the `cursor-plugin` branch, at its root, which the Cursor Marketplace reads (#530).
# Claude Code and ZCode install plugins/claude-code from main, which public-sync builds (#532).
# The dsh plugin goes to npm as wildcrane-dsh, by trusted publishing (#531). The Kimi Code plugin becomes
# the next commit of the `kimi-plugin` branch, at its root, which `/plugins install` reads (#533).
name: plugin-release

on:
  push:
    tags: ['plugin-v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  verify-publisher:
    if: github.repository == 'wildcrane-ai/wildcrane' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node runner/scripts/check-npm-publisher.mjs
  build:
    if: github.repository == 'wildcrane-ai/wildcrane' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches every plugin's version
        run: |
          for file in plugins/claude-code/.claude-plugin/plugin.json plugins/codex/plugin.json plugins/cursor/.cursor-plugin/plugin.json plugins/dsh/package.json plugins/kimi-code/kimi.plugin.json plugins/grok/plugin.json plugins/opencode/package.json; do
            version=$(node -p "require('./$file').version")
            [ "plugin-v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME, $file $version"; exit 1; }
          done
      - run: npm ci
        working-directory: cli
      - run: npm install --include=dev
        working-directory: runner
      - run: npm run build
        working-directory: runner
      - name: Pack the Codex marketplace
        working-directory: plugins
        run: |
          zip -qr "$GITHUB_WORKSPACE/wildcrane-codex.zip" .agents codex -x 'codex/node_modules/*'
          echo "codex sha256: $(sha256sum "$GITHUB_WORKSPACE/wildcrane-codex.zip" | cut -d' ' -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish the Codex marketplace and the Cursor, Kimi Code and Grok plugins to their branches
        run: |
          publish() { # <branch> <folder> <name>
            parent=$(git ls-remote origin "refs/heads/$1" | cut -f1)
            [ -z "$parent" ] || git fetch -q origin "$parent"
            tree=$(GIT_INDEX_FILE="$RUNNER_TEMP/$1-index" GIT_WORK_TREE="$2" sh -c 'git add -A && git write-tree')
            commit=$(GIT_AUTHOR_NAME=WildCrane GIT_AUTHOR_EMAIL=noreply@wildcrane.ai GIT_COMMITTER_NAME=WildCrane GIT_COMMITTER_EMAIL=noreply@wildcrane.ai \
              git commit-tree "$tree" ${parent:+-p "$parent"} -m "WildCrane $3 plugin ${GITHUB_REF_NAME#plugin-v}")
            git push -q origin "$commit:refs/heads/$1"
          }
          codex="$RUNNER_TEMP/codex-plugin"
          mkdir -p "$codex"
          cp -R plugins/.agents "$codex/"
          tar -C plugins --exclude=codex/node_modules --exclude=codex/.gitignore -cf - codex | tar -C "$codex" -xf -
          publish codex-plugin "$codex" Codex
          cursor="$RUNNER_TEMP/cursor-plugin"
          mkdir -p "$cursor"
          tar -C plugins/cursor --exclude=./node_modules --exclude=./.gitignore -cf - . | tar -C "$cursor" -xf -
          publish cursor-plugin "$cursor" Cursor
          kimi="$RUNNER_TEMP/kimi-plugin"
          mkdir -p "$kimi"
          tar -C plugins/kimi-code --exclude=./node_modules --exclude=./.gitignore -cf - . | tar -C "$kimi" -xf -
          publish kimi-plugin "$kimi" "Kimi Code"
          grok="$RUNNER_TEMP/grok-plugin"
          mkdir -p "$grok"
          tar -C plugins/grok --exclude=./node_modules --exclude=./.gitignore -cf - . | tar -C "$grok" -xf -
          publish grok-plugin "$grok" "Grok Build"
      - name: Publish the dsh plugin to npm
        working-directory: plugins/dsh
        run: |
          npm view "wildcrane-dsh@${GITHUB_REF_NAME#plugin-v}" version | grep -q . && exit 0
          npm install -g npm@latest
          npm publish --provenance --access public
      - name: Publish the OpenCode plugin to npm
        working-directory: plugins/opencode
        run: |
          npm view "wildcrane-opencode@${GITHUB_REF_NAME#plugin-v}" version | grep -q . && exit 0
          npm install -g npm@latest
          npm publish --provenance --access public
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" wildcrane-codex.zip --title "WildCrane plugins ${GITHUB_REF_NAME#plugin-v}" --notes "Claude Code: \`claude plugin marketplace add wildcrane-ai/wildcrane\`, then \`claude plugin install wildcrane@wildcrane\`. ZCode: Settings → Plugin Management → Discover → +, enter \`wildcrane-ai/wildcrane\`, then Get wildcrane. Codex: \`codex plugin marketplace add wildcrane-ai/wildcrane --ref codex-plugin\`, then \`codex plugin add wildcrane@wildcrane\`. Cursor: the \`cursor-plugin\` branch. dsh: \`dsh plugin --profile web add wildcrane-dsh\`. OpenCode V2: \`opencode plugin add wildcrane-opencode\`. OpenCode V1: add \`wildcrane-opencode\` to \`plugin\`. Grok Build: \`grok plugin install wildcrane-ai/wildcrane@grok-plugin --trust\`. Kimi Code: \`/plugins install https://github.com/wildcrane-ai/wildcrane/tree/kimi-plugin\`." --latest=false
